<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>魚酷終極密碼</title>

    <style>
        .ga{
            display: flex;
            align-items: center;
            gap: 5px;
        }
        body {
            font-size: 48px;
        }

        h1 {
            font-size: 96px;
        }

        input {
            font-size: 56px;
            width: 400px;
            padding: 20px;
        }

        button {
            font-size: 56px;
            padding: 20px 40px;
        }
    </style>
</head>
<body>
    <h1>終極密碼!</h1>
    <p>猜個數字吧!</p>
    <div class="ga">
        <input id="guess-input" type="number">
        <button id="guess-bt" style="display: block;">猜</button>
    </div>
    <p id="mes">現在範圍:1~100</p>
    <button id = "re" style="display: none;">再來一局</button>

    <script>
        const gsbutton  = document.getElementById("guess-bt");
        const mes = document.getElementById("mes");
        const guessinput = document.getElementById("guess-input");
        const ans = Math.floor(Math.random()*100)+1;
        const answer = document.getElementById("answer");
        const again = document.getElementById("re");
        let max = 100;
        let min = 1;  
        function check(){
            const guess = guessinput.value;
            const guessn = Number(guessinput.value);
            if (!Number.isInteger(guessn)) {
                mes.textContent = "請輸入整數";
                setTimeout(function(){mes.textContent = "現在範圍:" + min + "~" + max}, 500);
                guessinput.value = "";
                return;
            }
            if(guess == ""){
                mes.textContent = "請先輸入數字";
                setTimeout(function(){mes.textContent = "現在範圍:" + min + "~" + max}, 500);
                return;
            }
            if(guessn > max || guessn < min){
                mes.textContent = "超出範圍";
                setTimeout(function(){mes.textContent = "現在範圍:" + min + "~" + max}, 500);
            }
            else if(guessn > ans){
                max = guessn;
                mes.textContent = "現在範圍:" + min + "~" + max;
            }
            else if(guessn < ans){
                min = guessn;
                mes.textContent = "現在範圍:" + min + "~" + max;
            }
            else{
                mes.textContent = "猜到了! 耶!";
                gsbutton.style.display = "none";
                again.style.display = "block";
            }
            guessinput.value = "";
        }
        gsbutton.addEventListener("click", check);
        again.addEventListener("click", function(){location.reload()});
    </script>
</body>
</html>
